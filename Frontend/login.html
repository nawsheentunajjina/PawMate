<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in · Pawmate</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="app">
  <div class="topbar"><a class="back" href="index.html" aria-label="Back">&larr;</a><h1>Log in</h1></div>
  <form id="form">
    <div class="field"><label for="email">Email</label><input type="email" id="email" required></div>
    <div class="field"><label for="pass">Password</label><input type="password" id="pass" required></div>
    <p id="error" role="alert" style="color:#B3261E;font-size:14px;min-height:20px"></p>
    <button class="btn big" type="submit">Log in</button>
    <p class="muted">New here? <a href="signup.html">Create an account</a>. You can also <a href="report.html">report an animal without an account</a>.</p>
  </form>
</main>
<script src="js/data.js"></script>
<script src="js/login.js"></script>
</body>
</html>
