<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Become a volunteer · Pawmate</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="app">
  <div class="topbar"><a class="back" href="index.html" aria-label="Back">&larr;</a><h1>Become a volunteer</h1></div>
  <p class="muted" style="margin-top:-6px">Volunteers take cases near them and post updates until the animal is treated.</p>
  <form id="form">
    <div class="field"><label for="name">Name</label><input type="text" id="name" required></div>
    <div class="field"><label for="email">Email</label><input type="email" id="email" required></div>
    <div class="field"><label for="phone">Phone</label><input type="text" id="phone" required></div>
    <div class="field"><label for="pass">Password</label><input type="password" id="pass" required minlength="6"></div>
    <div class="field"><label for="area">Your area</label><input type="text" id="area" placeholder="e.g. Gulshan" required></div>
    <div class="loc">
      <div class="grow"><strong>Save my location</strong><div class="muted" id="locStatus">Helps us show cases near you</div></div>
      <button type="button" class="link-btn" id="locBtn">Use mine</button>
    </div>
    <div class="field"><label for="radius">How far can you travel?</label>
      <select id="radius"><option value="2">2 km</option><option value="5" selected>5 km</option><option value="10">10 km</option><option value="20">20 km</option></select></div>
    <div class="field"><label for="about">Why do you want to volunteer? (optional)</label><textarea id="about"></textarea></div>
    <div class="field"><label><input type="checkbox" id="agree" required> I have read the <a href="safety.html">safety tips</a></label></div>
    <p id="error" role="alert" style="color:#B3261E;font-size:14px;min-height:20px"></p>
    <button class="btn big" type="submit">Create volunteer account</button>
    <p class="muted">Already have an account? <a href="login.html">Log in</a></p>
  </form>
</main>
<script src="js/data.js"></script>
<script src="js/volunteer-signup.js"></script>
</body>
</html>
